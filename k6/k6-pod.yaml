#
# In-cluster k6 pod. Reads the script from the k6-script ConfigMap
# (see k6/README.md for how to create it from k6/100k-users.js).
# Resource requests are sized for a t3.small-only NodePool -- raise them if
# running against bigger nodes, but a single k6 process still cannot
# realistically sustain 100,000 VUs; scale the script's stage targets down
# to match whatever capacity your cluster actually has.
apiVersion: v1
kind: Pod
metadata:
  name: k6
  namespace: k6
  labels:
    app: k6
spec:
  restartPolicy: Never
  containers:
  - name: k6
    image: grafana/k6:latest
    command: ["k6", "run", "/scripts/100k-users.js"]
    env:
    - name: FRONTEND_URL
      value: "http://frontend.online-boutique.svc.cluster.local"
    resources:
      requests:
        cpu: 500m
        memory: 700Mi
      limits:
        cpu: "1"
        memory: 1200Mi
    volumeMounts:
    - name: script
      mountPath: /scripts
  volumes:
  - name: script
    configMap:
      name: k6-script
