# Karpenter NodePool + EC2NodeClass for online-boutique-production.
# Requires the Karpenter controller installed first (see README.md in this
# directory) and replaces/supplements the Cluster Autoscaler addon in
# addons/cluster-autoscaler -- run one or the other, not both, to avoid the
# two controllers fighting over node scale-down decisions.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: online-boutique-production
spec:
  amiFamily: AL2023
  amiSelectorTerms:
  - alias: al2023@latest
  role: online-boutique-production-karpenter-node
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: online-boutique-production
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: online-boutique-production
  tags:
    Owner: platform-team
    CostCenter: online-boutique
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]``
      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["t3.small"] # account restricted to free-tier-eligible instance types
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: online-boutique-production
      expireAfter: 720h
  limits:
    cpu: "16"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
