#
# Values for the upstream eks/aws-load-balancer-controller Helm chart.
#
# helm repo add eks https://aws.github.io/eks-charts
# helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
#   -n kube-system \
#   -f addons/aws-load-balancer-controller/values.yaml \
#   --set clusterName=online-boutique-production \
#   --set serviceAccount.create=false \
#   --set serviceAccount.name=aws-load-balancer-controller

clusterName: online-boutique-production
region: us-east-1
vpcId: "" # TODO: terraform-aws output `vpc_id`

serviceAccount:
  create: false
  name: aws-load-balancer-controller

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
