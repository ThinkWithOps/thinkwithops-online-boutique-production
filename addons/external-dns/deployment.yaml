# ExternalDNS: watches the frontend Ingress (../aws-load-balancer-controller/
# ingress-frontend.yaml) and syncs Route53 records for it. Authenticates via
# IRSA using the ServiceAccount in serviceaccount.yaml -- the IAM policy
# (terraform-aws/iam.tf `external_dns` policy) is scoped to
# route53:ChangeResourceRecordSets on var.external_dns_domain_filter's zone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: kube-system
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.15.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        args:
        - --source=ingress
        - --source=service
        - --provider=aws
        - --aws-zone-type=public
        - --registry=txt
        - --txt-owner-id=online-boutique-production
        # TODO: set to the same Route53 domain as terraform-aws
        # var.external_dns_domain_filter.
        - --domain-filter=<ROUTE53_DOMAIN>
        - --policy=upsert-only
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
