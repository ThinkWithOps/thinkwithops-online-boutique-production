#
# GitOps "staging" environment overlay (namespace: online-boutique-staging).
# Layered on top of helm-chart/values.yaml, same pattern as values-dev.yaml:
#
#   helm upgrade --install online-boutique helm-chart/ \
#     -f helm-chart/values.yaml -f helm-chart/values-staging.yaml \
#     --namespace online-boutique-staging --create-namespace
#
# ArgoCD's ApplicationSet generates staging with syncPolicy.automated OMITTED
# (manual sync only) and selfHeal left off by the same omission -- ArgoCD ties
# selfHeal to automated sync, so a manually-synced app can't self-heal even if
# the flag were set; drift here surfaces as OutOfSync and stays until someone
# runs `argocd app sync online-boutique-staging`. See docs/environment-promotion.md.
# 2 replicas + light autoscaling here (vs dev's flat 1) so staging is a closer
# rehearsal of prod's canary/rollback behavior without prod's blast radius.

frontend:
  externalService: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  rollouts:
    enabled: true
    steps:
      - setWeight: 10
        pauseSeconds: 30
      - setWeight: 50
        pauseSeconds: 30
      - setWeight: 100

adService: { replicaCount: 2 }
cartService: { replicaCount: 2 }
checkoutService:
  replicaCount: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
currencyService: { replicaCount: 2 }
emailService: { replicaCount: 1 }
paymentService: { replicaCount: 2 }
productCatalogService: { replicaCount: 2 }
recommendationService: { replicaCount: 1 }
shippingService: { replicaCount: 1 }
loadGenerator: { replicaCount: 1 }
