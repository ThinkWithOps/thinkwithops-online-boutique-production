# Values overlay for the kube-prometheus-stack Helm chart
# (prometheus-community/kube-prometheus-stack), scoped to what's needed to
# watch HPA/Karpenter autoscaling behavior during the k6 load test:
# - kube-state-metrics for HPA/Deployment/Node object metrics
# - node-exporter + cAdvisor (bundled) for per-pod/per-node CPU & memory
# - a scrape job for the otel-collector's Prometheus exporter endpoint
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f observability/prometheus/values.yaml

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    additionalScrapeConfigs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.online-boutique.svc.cluster.local:8889']

kube-state-metrics:
  enabled: true

nodeExporter:
  enabled: true

grafana:
  enabled: false # observability/grafana/ is provisioned separately so its dashboard JSON can be version-controlled directly
