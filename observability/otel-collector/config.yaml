#
# OpenTelemetry Collector config -- receives OTLP traces/metrics from the
# app's existing opentelemetrycollector Deployment (helm-chart/values.yaml
# already ships one for tracing; this ConfigMap replaces its default config
# to additionally expose a Prometheus-scrapeable metrics endpoint consumed by
# observability/prometheus/values.yaml's additionalScrapeConfigs).
#
# Apply:
#   kubectl create configmap otel-collector-config -n online-boutique \
#     --from-file=config.yaml=observability/otel-collector/config.yaml \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n online-boutique rollout restart deployment/opentelemetrycollector

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 5s
    limit_mib: 400

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    const_labels:
      cluster: online-boutique-production
  logging:
    loglevel: warn

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, logging]
