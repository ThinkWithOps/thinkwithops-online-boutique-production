#
# Template for the Secret alertmanager/values.yaml's `secrets:` block
# expects, mounted at /etc/alertmanager/secrets/alertmanager-slack-webhook/.
#
# 1. Create a Slack Incoming Webhook: https://api.slack.com/messaging/webhooks
# 2. Copy this file, fill in the real URL, DO NOT commit the copy:
#      cp slack-webhook-secret.example.yaml slack-webhook-secret.yaml
#      # edit webhook-url below
#      kubectl apply -f slack-webhook-secret.yaml
#
# Or skip the file entirely and create it directly:
#   kubectl create secret generic alertmanager-slack-webhook \
#     --namespace monitoring \
#     --from-literal=webhook-url='https://hooks.slack.com/services/T000/B000/XXXXXXXXXXXXXXXXXXXXXXXX'

apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-webhook
  namespace: monitoring
type: Opaque
stringData:
  webhook-url: "https://hooks.slack.com/services/REPLACE/WITH/REAL_WEBHOOK"
