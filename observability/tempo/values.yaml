#
# Values overlay for the `grafana/tempo` Helm chart -- single-binary mode
# (not tempo-distributed), local filesystem storage. This is the only mode
# that makes sense on a single-node minikube cluster with no object store.
#
# Receives traces from the existing otel-collector Deployment (see
# observability/otel-collector/config.yaml, which exports OTLP to
# tempo.monitoring.svc.cluster.local:4317 alongside its existing Prometheus
# metrics + spanmetrics pipeline).
#
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm repo update
#   helm install tempo grafana/tempo \
#     --namespace monitoring --create-namespace \
#     -f observability/tempo/values.yaml

tempo:
  retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

# OTLP gRPC (4317) and HTTP (4318) receivers are enabled by default in this
# chart -- no override needed, the otel-collector's tempo exporter targets
# tempo.monitoring.svc.cluster.local:4317 directly.
