#
# Builds each microservice's existing Dockerfile, pushes to ECR, and deploys
# to the "online-boutique-production" EKS cluster (us-east-1) via Helm.
# Authenticates to AWS using GitHub's OIDC provider (no long-lived AWS access
# keys) through the role provisioned by terraform-aws/iam.tf
# (`aws_iam_role.github_actions_deploy`, output `github_actions_deploy_role_arn`).
#
# This is a NEW, AWS-specific workflow -- it does not modify or replace the
# existing GCP-oriented workflows in this directory.

name: "AWS EKS Deploy (online-boutique-production)"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'terraform/**'
      - 'kubernetes-manifests/**'
      - 'kustomize/**'
      - 'helm-chart/values*.yaml' # values-aws-production.yaml changes still deploy via workflow_dispatch
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC federation to AWS
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: online-boutique-production
  # TODO: fill in with the role ARN from `terraform output github_actions_deploy_role_arn`
  DEPLOY_ROLE_ARN: arn:aws:iam::928967253353:role/online-boutique-production-github-actions-deploy

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: src/adservice
          - service: cartservice
            context: src/cartservice/src
          - service: checkoutservice
            context: src/checkoutservice
          - service: currencyservice
            context: src/currencyservice
          - service: emailservice
            context: src/emailservice
          - service: frontend
            context: src/frontend
          - service: loadgenerator
            context: src/loadgenerator
          - service: paymentservice
            context: src/paymentservice
          - service: productcatalogservice
            context: src/productcatalogservice
          - service: recommendationservice
            context: src/recommendationservice
          - service: shippingservice
            context: src/shippingservice
          - service: shoppingassistantservice
            context: src/shoppingassistantservice
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # ECR repos are IMMUTABLE (terraform-aws/ecr.tf) -- only push the
          # unique git-sha tag, never a reusable tag like "latest" or a branch
          # name, since immutable repos reject re-pushing an existing tag.
          # The Helm deploy step below already references images.tag=$GIT_SHA.
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-24.04
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm upgrade --install
        run: |
          helm upgrade --install online-boutique helm-chart/ \
            --namespace online-boutique \
            --create-namespace \
            -f helm-chart/values.yaml \
            -f helm-chart/values-aws-production.yaml \
            --set images.tag=${{ github.sha }} \
            --set frontend.externalService=true \
            --wait --timeout 10m
          # values-aws-production.yaml defaults to ALB-mode (externalService: false), which
          # requires the aws-load-balancer-controller add-on (addons/) to be installed first.
          # This workflow doesn't install that add-on, so override to a plain LoadBalancer
          # Service instead -- matches the verified working deploy documented in README.md.

      - name: Verify rollout
        run: |
          kubectl -n online-boutique rollout status deployment/frontend --timeout=5m
