# Non-secret AWS-specific config shared by the addons in ../addons/.
# Mirrors the pattern of a plain ConfigMap used elsewhere in this repo's
# kubernetes-manifests/ (no app code reads this directly -- it documents /
# centralizes the values that get substituted into addons/*/deployment.yaml).
#
# TODO: fill in the real values before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-cluster-config
  namespace: kube-system
data:
  cluster-name: "online-boutique-production"
  aws-region: "us-east-1"
  # Route53 hosted zone ExternalDNS is allowed to manage. Must match
  # terraform-aws var.external_dns_domain_filter.
  external-dns-domain-filter: "<ROUTE53_DOMAIN>" # e.g. "onlineboutique.example.com"
  # ACM certificate ARN used by the ALB Ingress for TLS termination.
  alb-acm-certificate-arn: "<ACM_CERTIFICATE_ARN>"
