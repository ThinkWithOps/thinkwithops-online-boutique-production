#
# HorizontalPodAutoscalers for every service that runs as a long-lived
# Deployment (loadgenerator is a batch-style generator and
# shoppingassistantservice is disabled by default -- both excluded).
# Requires the metrics-server EKS add-on for both CPU and memory metrics.
# Deployment names must match helm-chart/values.yaml's `*.name` fields, which
# are unchanged in values-aws-production.yaml.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: online-boutique
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
