# HorizontalPodAutoscalers for the services most exposed to load-driven
# traffic spikes. Requires the metrics-server addon (bundled in EKS via the
# `metrics-server` EKS add-on, or install separately -- not included here).
# Deployment names must match helm-chart/values.yaml's `*.name` fields
# (e.g. .Values.frontend.name), which are unchanged in
# values-aws-production.yaml.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: online-boutique
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
