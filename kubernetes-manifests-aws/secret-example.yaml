#
# EXAMPLE ONLY -- do not commit real credentials. None of the addons in
# ../addons/ actually require a static Secret (they authenticate to AWS via
# IRSA, i.e. a ServiceAccount annotation + the pod's projected OIDC token --
# see addons/*/serviceaccount.yaml), but this shows the pattern to follow if
# a future add-on needs one (e.g. a webhook token, a third-party API key).
#
# Populate for real via `kubectl create secret generic ... --from-literal=`
# or a secrets manager integration (AWS Secrets Manager + External Secrets
# Operator is recommended over checking values in here).
apiVersion: v1
kind: Secret
metadata:
  name: online-boutique-aws-example
  namespace: online-boutique
type: Opaque
stringData:
  EXAMPLE_KEY: "REPLACE_ME"
