# OPTIONAL strategic-merge patch, placeholder for pinning workloads to the
# managed node group created by terraform-aws/eks.tf (labels.role =
# "online-boutique-production-worker") and spreading pods across the 3 AZs.
#
# helm-chart/templates/*.yaml does not currently expose nodeSelector /
# affinity / tolerations as chart values, so this is not auto-applied by
# `helm upgrade`. Apply with `kubectl patch` / `kustomize patches`, or add
# nodeSelector/affinity blocks directly in helm-chart/templates if you want
# it templated (out of scope for this AWS layer, which avoids touching the
# shared chart templates used by the GCP deployment path too).
#
# Example (frontend shown; repeat per Deployment as needed):
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: online-boutique
spec:
  template:
    spec:
      nodeSelector:
        role: online-boutique-production-worker
      tolerations: []
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: frontend
